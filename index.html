<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Розклад ЕП-26-1Д</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f5f6f8;--card:#fff;--text:#16181d;--muted:#6b7280;--line:#e5e7eb;
  --accent:#2563eb;--accent-soft:#dbeafe;--ok:#16a34a;--ok-soft:#dcfce7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115;--card:#181b21;--text:#eceef2;--muted:#9aa1ad;--line:#2a2e37;
    --accent:#60a5fa;--accent-soft:#1e3a5f;--ok:#4ade80;--ok-soft:#14351f;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115;--card:#181b21;--text:#eceef2;--muted:#9aa1ad;--line:#2a2e37;
  --accent:#60a5fa;--accent-soft:#1e3a5f;--ok:#4ade80;--ok-soft:#14351f;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
h1{font-size:18px;margin:0}
#clock{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.week{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.week button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;
  width:40px;height:34px;font-size:16px;cursor:pointer}
.week span{font-size:14px;color:var(--muted)}
.chips{display:flex;gap:6px;margin-bottom:14px}
.chip{flex:1;min-width:0;padding:6px 0;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font:inherit;font-size:14px;cursor:pointer;text-align:center;line-height:1.2}
.chip small{display:block;color:var(--muted);font-size:11px}
.chip.has::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin:3px auto 0}
.chip:not(.has)::after{content:"";display:block;height:5px;margin-top:3px}
.chip.today{border-color:var(--accent)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.active small{color:#dbeafe}
.chip.active.has::after{background:#fff}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.hero .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.hero .label.live{color:var(--ok);font-weight:600}
.hero h2{margin:0 0 2px;font-size:20px}
.hero .meta{color:var(--muted);font-size:14px;margin-bottom:12px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .8s}
.barinfo{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-block;padding:10px 16px;border-radius:10px;background:var(--accent);
  color:#fff;text-decoration:none;font-weight:600;font-size:15px}
.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:9px 15px}
.note{font-size:13px;color:var(--muted);margin-top:8px;word-break:break-all}
.list{display:flex;flex-direction:column;gap:8px}
.lesson{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.lesson .time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:44px;line-height:1.3}
.lesson .info{flex:1;min-width:0}
.lesson .t{font-weight:600}
.lesson .s{font-size:13px;color:var(--muted)}
.lesson .links{display:flex;gap:12px;margin-top:6px}
.lesson a{font-size:14px;font-weight:600;color:var(--accent);text-decoration:none}
.lesson.done{opacity:.5}
.lesson.now{border-color:var(--ok);background:var(--ok-soft)}
.lesson.next{border-color:var(--accent);background:var(--accent-soft)}
.empty{text-align:center;color:var(--muted);padding:28px 0}
</style>
</head>
<body>
<main>
  <header><h1>Розклад · ЕП-26-1Д</h1><span id="clock"></span></header>
  <div class="week"><button id="prev" aria-label="Попередній тиждень">‹</button><span id="range"></span><button id="nextw" aria-label="Наступний тиждень">›</button></div>
  <div class="chips" id="chips"></div>
  <div id="hero"></div>
  <div class="list" id="list"></div>
</main>

<script>
/* ===================== ДАНІ ===================== */
const ZOOM_KUZ = "https://us05web.zoom.us/j/88148169104?pwd=iFCHP5ReamceQQq5k4hPtSBhaaz6Tx.1";
const NOTE_KUZ = "ID 881 4816 9104 · код доступу: 1JLzze";

// Предмети: викладач, посилання на пару (link), Google Classroom, примітка
const SUBJ = {
  math: {title:"Вища математика", teacher:"Поворотній Віктор Володимирович",
    link:"https://meet.google.com/qma-nsmj-dib",
    classroom:"https://classroom.google.com/c/ODc4NDIxOTM3NTEz?cjc=sno2mwkg"},
  cult: {title:"Культурологія", teacher:"Кузнецов Олександр Анатолійович",
    link:ZOOM_KUZ, note:NOTE_KUZ,
    classroom:"https://classroom.google.com/c/ODI2MjAyMTgzODk1?hl=ru&cjc=2c2c7vtr"},
  hist: {title:"Історія України", teacher:"Кузнецов Олександр Анатолійович",
    link:ZOOM_KUZ, note:NOTE_KUZ,
    classroom:"https://classroom.google.com/c/ODc4MTg5Mjg5OTEw?hl=ru&cjc=syoakbgh"},
  phil: {title:"Основи філософських знань", teacher:"Кузнецов Олександр Анатолійович",
    link:ZOOM_KUZ, note:NOTE_KUZ,
    classroom:"https://classroom.google.com/c/ODc4MTkzMTA0ODQy?hl=ru&cjc=rplesvyy"},
  inf: {title:"Інформатика і комп'ютерна техніка", teacher:"Лозова Світлана Вікторівна",
    link:"https://meet.google.com/xsv-zdov-iir",
    classroom:"https://classroom.google.com/c/ODc4MjczMDgxMDE2?cjc=k2e7b4ci"},
  eng: {title:"Іноземна мова (за професійним спрямуванням)", teacher:"Підвисоцька Галина Володимирівна",
    link:"https://us05web.zoom.us/j/6665056267?pwd=WXRCa2MyWWRSTVdlbUFpcGFVeTJzZz09",
    note:"ID 666 505 6267 · код доступу: Rt1A5N", classroom:""},
  ukr: {title:"Українська мова (за професійним спрямуванням)", teacher:"Гуцалова Вікторія Іванівна",
    link:"https://us05web.zoom.us/j/4616582393?pwd=MG44YVZSYmR2YzIrZzRWSFNib0ZxZz09&omn=81424583029",
    note:"ID 461 658 2393 · код доступу: t88taC",
    classroom:"https://classroom.google.com/c/ODc4NDM3MDg4ODA1?cjc=atxhkrqg"}
};

// Номер пари → час
const SLOTS = {1:["08:00","09:20"], 2:["09:30","10:50"], 3:["11:00","12:20"],
               4:["13:00","14:20"], 5:["14:30","15:50"], 6:["16:00","17:20"]};

// Розклад по датах: "РРРР-ММ-ДД": [ [номер пари, предмет], ... ]
const SCHEDULE = {
  "2026-10-12": [[2,"math"],[3,"cult"],[4,"inf"]],
  "2026-10-13": [[1,"hist"],[2,"eng"],[3,"inf"]],
  "2026-10-14": [[1,"ukr"],[2,"cult"],[3,"math"]],
  "2026-10-15": [[2,"math"],[3,"phil"]],
  "2026-10-16": [[1,"phil"],[2,"inf"],[3,"eng"],[4,"math"]]
};
/* ================================================= */

const WD = ["Пн","Вт","Ср","Чт","Пт"];
const FULL = ["Неділя","Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота"];
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safeUrl = u => /^https:\/\//i.test(u) ? u : "";
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d,n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); return x; };
const mondayOf = d => addDays(d, -((d.getDay()+6)%7));
const fmtShort = d => `${pad(d.getDate())}.${pad(d.getMonth()+1)}`;

const sim = new URLSearchParams(location.search).get("t");   // ?t=2026-10-12T09:15 для перевірки
const getNow = () => sim ? new Date(sim) : new Date();

const weekHasData = m => [0,1,2,3,4].some(i => SCHEDULE[keyOf(addDays(m,i))]);
const firstDataDay = m => { for (let i=0;i<5;i++){ const k = keyOf(addDays(m,i)); if (SCHEDULE[k]) return k; } return keyOf(m); };

let weekStart = mondayOf(getNow());
if (!weekHasData(weekStart)){
  for (let i=1;i<=30;i++){ const m = addDays(weekStart, 7*i); if (weekHasData(m)){ weekStart = m; break; } }
}
let selected = (() => {
  const t = keyOf(getNow());
  for (let i=0;i<5;i++) if (keyOf(addDays(weekStart,i)) === t) return t;
  return firstDataDay(weekStart);
})();

function fmtLeft(min){
  min = Math.max(0, Math.ceil(min));
  const h = Math.floor(min/60), m = min%60;
  return h ? `${h} год ${m} хв` : `${m} хв`;
}

function links(l, cls){
  let h = "";
  if (safeUrl(l.link)) h += `<a class="${cls}" href="${esc(l.link)}" target="_blank" rel="noopener">${"Приєднатися"}</a>`;
  
  return h;
}

function render(){
  const now = getNow();
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  $("clock").textContent = `${FULL[now.getDay()]}, ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  $("range").textContent = `${fmtShort(weekStart)} – ${fmtShort(addDays(weekStart,4))}`;

  const todayKey = keyOf(now);
  $("chips").innerHTML = WD.map((n,i) => {
    const d = addDays(weekStart,i), k = keyOf(d);
    return `<button class="chip ${SCHEDULE[k]?"has":""} ${k===todayKey?"today":""} ${k===selected?"active":""}" data-k="${k}">${n}<small>${fmtShort(d)}</small></button>`;
  }).join("");

  const lessons = (SCHEDULE[selected] || []).map(([s,k]) => ({start:SLOTS[s][0], end:SLOTS[s][1], ...SUBJ[k]}));
  const isToday = selected === todayKey;
  let cur = null, next = null;
  if (isToday){
    cur = lessons.find(l => nowMin >= toMin(l.start) && nowMin < toMin(l.end)) || null;
    next = lessons.find(l => toMin(l.start) > nowMin) || null;
  }

  let hero = "";
  const meta = l => `${l.start}–${l.end}${l.teacher ? " · "+esc(l.teacher) : ""}`;
  if (cur){
    const a = toMin(cur.start), b = toMin(cur.end);
    const pct = Math.min(100, Math.max(0, (nowMin-a)/(b-a)*100));
    hero = `<div class="hero"><div class="label live">● Зараз іде</div>
      <h2>${esc(cur.title)}</h2><div class="meta">${meta(cur)}</div>
      <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
      <div class="barinfo"><span>${Math.round(pct)}%</span><span>залишилось ${fmtLeft(b-nowMin)}</span></div>
      <div class="btns">${links(cur,"btn")}</div>
      ${cur.note ? `<div class="note">${esc(cur.note)}</div>` : ""}</div>`;
  } else if (isToday && next){
    hero = `<div class="hero"><div class="label">Далі · через ${fmtLeft(toMin(next.start)-nowMin)}</div>
      <h2>${esc(next.title)}</h2><div class="meta">${meta(next)}</div>
      <div class="btns">${links(next,"btn")}</div>
      ${next.note ? `<div class="note">${esc(next.note)}</div>` : ""}</div>`;
  } else if (isToday && lessons.length){
    hero = `<div class="hero"><div class="label">На сьогодні все</div><h2>Пари закінчились 🎉</h2></div>`;
  }
  $("hero").innerHTML = hero;

  $("list").innerHTML = lessons.length ? lessons.map(l => {
    let cls = "";
    if (isToday){
      if (nowMin >= toMin(l.end)) cls = "done";
      else if (l === cur) cls = "now";
      else if (l === next && !cur) cls = "next";
    }
    return `<div class="lesson ${cls}">
      <div class="time">${l.start}<br>${l.end}</div>
      <div class="info"><div class="t">${esc(l.title)}</div>
        <div class="s">${esc(l.teacher)}</div>
        <div class="links">${links(l,"lk")}</div></div></div>`;
  }).join("") : `<div class="empty">Пар немає</div>`;
}

function shiftWeek(n){
  weekStart = addDays(weekStart, 7*n);
  const t = keyOf(getNow());
  selected = firstDataDay(weekStart);
  for (let i=0;i<5;i++) if (keyOf(addDays(weekStart,i)) === t) selected = t;
  render();
}
$("prev").onclick = () => shiftWeek(-1);
$("nextw").onclick = () => shiftWeek(1);
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (b){ selected = b.dataset.k; render(); }
});
render();
if (!sim) setInterval(render, 15000);
</script>
</body>
</html>
